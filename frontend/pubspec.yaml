name: stock_talk
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+5

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^10.3.0
  get_it: ^8.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  provider: ^6.1.5+1
  dio: ^5.9.0
  intl: ^0.20.2
  candlesticks: ^2.1.0
  firebase_core: ^4.3.0
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  auto_route_generator: ^10.3.1
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/icons/actions/
    - assets/icons/nav/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
